<div class="login-page">
  <form class="login-card" (ngSubmit)="entrar()">
    <h1>NVK</h1>
    <p class="subtitle">Sistema de Control de Cortes</p>

    <label for="usuario">Usuario</label>
    <input id="usuario" name="usuario" [(ngModel)]="usuario" autocomplete="username" placeholder="Ingresa tu usuario" [disabled]="loading()" />

    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" [(ngModel)]="password" autocomplete="current-password" placeholder="Ingresa tu contraseña" [disabled]="loading()" />

    @if (error()) { <div class="error">{{ error() }}</div> }

    <button type="submit" [disabled]="loading()">{{ loading() ? 'Iniciando sesión…' : 'Iniciar sesión' }}</button>
    <span class="footer">NVK Acopio y Reciclaje</span>
  </form>
</div>
